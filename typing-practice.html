<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEFL Writing Typing Practice</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --accent: #f59e0b;
    --accent2: #3b82f6;
    --correct: #22c55e;
    --incorrect: #ef4444;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #334155;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }

  .container { width: 100%; max-width: 900px; }

  /* ── Header ───────────────────── */
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .subtitle { color: var(--muted); font-size: 0.83rem; margin-top: 3px; }

  /* ── Stats panel ──────────────── */
  .stats-panel {
    display: flex; justify-content: center; gap: 16px;
    margin-bottom: 18px; flex-wrap: wrap;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 20px; text-align: center; min-width: 85px;
  }
  .stat-card .value {
    font-size: 1.7rem; font-weight: 700;
    font-family: 'Cascadia Code','Fira Code','JetBrains Mono',monospace; line-height: 1.1;
  }
  .stat-card .value.wpm  { color: var(--accent); }
  .stat-card .value.acc  { color: var(--correct); }
  .stat-card .value.time { color: var(--accent2); }
  .stat-card .value.prog { color: #a78bfa; }
  .stat-card .label {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin-top: 2px;
  }

  /* ── Progress ─────────────────── */
  .progress-wrap { margin-bottom: 14px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--correct); border-radius: 2px; transition: width 0.15s; width: 0%; }

  /* ── Task type selector ───────── */
  .type-bar {
    display: flex; justify-content: center; gap: 10px;
    margin-bottom: 18px; flex-wrap: wrap;
  }
  .type-btn {
    padding: 8px 20px; border-radius: 22px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; font-size: 0.84rem;
    transition: all 0.2s; display: flex; align-items: center; gap: 6px;
  }
  .type-btn:hover { border-color: var(--accent); color: var(--text); }
  .type-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  .type-btn .badge {
    font-size: 0.65rem; background: rgba(255,255,255,.15);
    padding: 2px 8px; border-radius: 10px; letter-spacing: 0.5px;
  }
  .type-btn.active .badge { background: rgba(0,0,0,.15); }

  /* ── Passage card ─────────────── */
  .passage-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 26px 30px; margin-bottom: 14px;
    max-height: 420px; overflow-y: auto;
  }
  .passage-card .meta-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
  }
  .passage-card .task-type-tag {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px;
    font-weight: 700; padding: 3px 10px; border-radius: 4px;
  }
  .tag-integrated { color: #fbbf24; background: rgba(251,191,36,.12); }
  .tag-discussion { color: #60a5fa; background: rgba(96,165,250,.12); }
  .tag-email     { color: #34d399; background: rgba(52,211,153,.12); }
  .tag-academic  { color: #c084fc; background: rgba(192,132,252,.12); }

  .passage-card .field-label {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin-bottom: 6px; font-weight: 600;
  }

  .passage-card .passage-text {
    font-size: 1.06rem; line-height: 2; letter-spacing: 0.2px;
    user-select: none; word-break: break-word;
  }

  .passage-text span { position: relative; transition: color 0.08s; }
  .passage-text span.correct   { color: var(--correct); }
  .passage-text span.incorrect { color: var(--incorrect); background: rgba(239,68,68,.15); border-radius: 2px; }
  .passage-text span.current   { background: rgba(245,158,11,.35); border-radius: 2px; animation: blink 1s step-end infinite; }
  .passage-text span.pending   { color: var(--muted); }
  .passage-text span.nl        { font-size: 0.7rem; color: var(--muted); padding: 0 2px; }
  .passage-text span.nl.correct { color: var(--correct); }
  .passage-text span.nl.incorrect { color: var(--incorrect); background: rgba(239,68,68,.15); border-radius: 2px; }
  .passage-text span.nl.current { background: rgba(245,158,11,.35); border-radius: 2px; animation: blink 1s step-end infinite; }

  @keyframes blink {
    0%,100% { background: rgba(245,158,11,.35); }
    50%     { background: transparent; }
  }

  /* Role labels in discussion mode */
  .role-professor { color: #fbbf24; font-weight: 600; }
  .role-student   { color: #60a5fa; font-weight: 600; }

  /* ── Input ────────────────────── */
  .input-area { margin-bottom: 14px; }
  #typing-input {
    width: 100%; padding: 16px 20px; font-size: 1.05rem;
    font-family: 'Cascadia Code','Fira Code','JetBrains Mono',monospace;
    background: var(--surface); border: 2px solid var(--border);
    border-radius: 12px; color: var(--text); outline: none;
    resize: vertical; transition: border-color 0.2s;
    line-height: 1.7; min-height: 90px;
  }
  #typing-input:focus { border-color: var(--accent); }
  #typing-input::placeholder { color: var(--muted); opacity: 0.4; }

  /* ── Buttons ──────────────────── */
  .actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .btn {
    padding: 9px 22px; border-radius: 8px; border: none;
    font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .btn-accent  { background: var(--accent); color: #000; }
  .btn-accent:hover  { background: #e8900a; transform: translateY(-1px); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--muted); }

  .key-hints {
    display: flex; justify-content: center; gap: 18px; flex-wrap: wrap;
    font-size: 0.74rem; color: var(--muted);
  }
  .key-hints kbd {
    background: rgba(255,255,255,.07); padding: 1px 7px; border-radius: 4px;
    border: 1px solid var(--border); font-family: inherit;
  }

  /* ── Results overlay ──────────── */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
    z-index: 100; justify-content: center; align-items: center;
  }
  .overlay.show { display: flex; }
  .results-card {
    background: var(--surface); border-radius: 18px; padding: 34px 30px;
    text-align: center; max-width: 440px; width: 92%;
    border: 1px solid var(--border); box-shadow: 0 24px 64px rgba(0,0,0,.5);
  }
  .results-card h2 { font-size: 1.35rem; margin-bottom: 20px; }
  .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .result-item { background: rgba(0,0,0,.25); border-radius: 10px; padding: 14px; }
  .result-item .r-val {
    font-size: 1.7rem; font-weight: 700;
    font-family: 'Cascadia Code','Fira Code',monospace;
  }
  .result-item .r-lbl { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; }
  .r-amber  { color: var(--accent); }
  .r-green  { color: var(--correct); }
  .r-blue   { color: var(--accent2); }
  .r-purple { color: #a78bfa; }
  .overlay .hint { color: var(--muted); font-size: 0.8rem; margin-top: 12px; }

  /* ── Scrollbar ────────────────── */
  .passage-card::-webkit-scrollbar { width: 6px; }
  .passage-card::-webkit-scrollbar-track { background: transparent; }
  .passage-card::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 600px) {
    .passage-card { padding: 16px; max-height: 300px; }
    .passage-card .passage-text { font-size: 0.92rem; line-height: 1.8; }
    .stats-panel { gap: 6px; }
    .stat-card { padding: 8px 12px; min-width: 68px; }
    .stat-card .value { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>TOEFL iBT Writing — Typing Practice</h1>
    <p class="subtitle">Real question formats: Integrated Writing &amp; Academic Discussion</p>
  </div>

  <!-- Stats -->
  <div class="stats-panel">
    <div class="stat-card"><div class="value wpm" id="wpm">0</div><div class="label">WPM</div></div>
    <div class="stat-card"><div class="value acc" id="accuracy">100</div><div class="label">Accuracy</div></div>
    <div class="stat-card"><div class="value time" id="timer">0:00</div><div class="label">Time</div></div>
    <div class="stat-card"><div class="value prog" id="progress">0%</div><div class="label">Done</div></div>
  </div>

  <!-- Progress bar -->
  <div class="progress-wrap"><div class="progress-fill" id="progress-bar"></div></div>

  <!-- Task type selector -->
  <div class="type-bar">
    <button class="type-btn active" data-type="integrated">
      Integrated Writing <span class="badge">~300w</span>
    </button>
    <button class="type-btn" data-type="discussion">
      Academic Discussion <span class="badge">~180w</span>
    </button>
    <button class="type-btn" data-type="academic">
      Academic Writing <span class="badge">~120w</span>
    </button>
    <button class="type-btn" data-type="email">
      Email Writing <span class="badge">~100w</span>
    </button>
  </div>

  <!-- Passage -->
  <div class="passage-card">
    <div class="meta-row">
      <span class="task-type-tag tag-integrated" id="task-type-tag">Integrated Writing</span>
    </div>
    <div class="field-label" id="field-label"></div>
    <div class="passage-text" id="passage-text"></div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <textarea id="typing-input" rows="4" placeholder="Start typing the passage above..."
      autofocus spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
  </div>

  <!-- Buttons -->
  <div class="actions">
    <button class="btn btn-accent" id="btn-restart">New Passage</button>
    <button class="btn btn-outline" id="btn-shuffle">Shuffle</button>
    <button class="btn btn-outline" id="btn-reset">Reset</button>
  </div>

  <div class="key-hints">
    <span><kbd>Tab</kbd> new passage</span>
    <span><kbd>Esc</kbd> reset</span>
    <span><kbd>Enter</kbd> close results</span>
  </div>
</div>

<!-- Results -->
<div class="overlay" id="overlay">
  <div class="results-card">
    <h2>Practice Complete!</h2>
    <div class="results-grid">
      <div class="result-item"><div class="r-val r-amber" id="r-wpm">0</div><div class="r-lbl">WPM</div></div>
      <div class="result-item"><div class="r-val r-green" id="r-acc">100</div><div class="r-lbl">Accuracy %</div></div>
      <div class="result-item"><div class="r-val r-purple" id="r-chars">0</div><div class="r-lbl">Characters</div></div>
      <div class="result-item"><div class="r-val r-blue" id="r-time">0:00</div><div class="r-lbl">Time</div></div>
    </div>
    <button class="btn btn-accent" onclick="closeResults()">Next Passage</button>
    <p class="hint">or press <kbd>Enter</kbd></p>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  TOEFL iBT Writing — Real Question Formats
// ══════════════════════════════════════════════════════════════

const PASSAGES = {

  // ──────────────────────────────────────────────────────────
  //  Integrated Writing 阅读段
  //  结构：背景引入 → 中心论点 → 论据1 → 论据2 → 论据3
  //  每篇 ~280–350 词，模拟真实 TOEFL 综合写作阅读材料
  // ──────────────────────────────────────────────────────────
  integrated: [
    {
      topic: "Biology / Ecology",
      thesis: "The decline of honeybee populations is primarily driven by a combination of pesticide exposure, habitat loss, and climate change rather than any single factor.",
      text: "The worldwide decline of honeybee populations has emerged as a critical environmental concern with far-reaching implications for global agriculture and ecosystem stability. While researchers have investigated numerous potential causes, a growing consensus points to the interaction of three primary factors: neonicotinoid pesticide exposure, the progressive loss of wild foraging habitats, and climate-driven disruptions to seasonal flowering cycles. Although each of these stressors alone can harm bee colonies, evidence increasingly suggests that their combined effect is substantially greater than the sum of their individual impacts, creating a synergistic threat that demands a coordinated, multi-pronged policy response.\n\nFirst, neonicotinoid pesticides, which are widely used in commercial agriculture, have been shown to impair honeybee navigation, foraging efficiency, and reproductive success even at sublethal concentrations. Studies conducted across multiple continents have documented that colonies exposed to these chemicals exhibit markedly higher rates of queen failure and worker disorientation compared to unexposed control groups. The European Union's partial ban on neonicotinoids in 2013 provided researchers with a natural experiment, and subsequent data indicated partial colony recovery in regions where the restrictions were enforced most rigorously.\n\nSecond, the conversion of diverse natural landscapes into monoculture farmland has dramatically reduced the availability of the pollen and nectar sources that honeybees require for balanced nutrition throughout the year. When bees are forced to rely on a single crop species that blooms for only a few weeks annually, colonies experience nutritional stress during the remaining months, compromising their immune function and increasing their vulnerability to pathogens. Conservation programs that establish wildflower corridors adjacent to agricultural land have demonstrated measurable improvements in colony health metrics, providing strong evidence for the importance of habitat diversity.\n\nFinally, climate change is shifting the timing of flowering periods in many regions, creating phenological mismatches between the period when bee colonies are most active and the availability of their primary food sources. Unusually warm winters can also cause colonies to emerge from their dormant phase prematurely, expending energy reserves before sufficient forage is available. These climate-induced disruptions compound the effects of pesticide exposure and habitat loss, as nutritionally stressed colonies are less able to detoxify environmental contaminants and resist disease."
    },
    {
      topic: "Archaeology / History",
      thesis: "The collapse of the Bronze Age civilizations in the eastern Mediterranean around 1200 BCE resulted from a systems collapse triggered by interconnected environmental, economic, and military pressures.",
      text: "The sudden and nearly simultaneous collapse of several major Bronze Age civilizations in the eastern Mediterranean around 1200 BCE—including the Mycenaean kingdoms of Greece, the Hittite Empire in Anatolia, and numerous city-states along the Levantine coast—has puzzled historians and archaeologists for generations. Early scholarship tended to attribute this widespread societal dissolution to a single catastrophic cause, most commonly the invasion of the so-called Sea Peoples mentioned in Egyptian records. However, more recent interdisciplinary research, integrating archaeological evidence with paleoclimate data and textual analysis, supports a more nuanced interpretation: the collapse resulted from the catastrophic intersection of multiple environmental and socioeconomic stressors that collectively overwhelmed the adaptive capacity of these complex, interdependent societies.\n\nFirst, paleoclimate data from sediment cores, speleothems, and pollen records indicates that the eastern Mediterranean experienced a prolonged period of aridification beginning in the late thirteenth century BCE. This drought, which may have persisted for several decades, would have severely reduced agricultural yields across a region already operating near the limits of its productive capacity. Grain storage facilities excavated at multiple sites show evidence of having been emptied and abandoned rather than destroyed, suggesting gradual economic decline rather than sudden conquest.\n\nSecond, the Bronze Age economy was built upon long-distance trade networks that circulated essential raw materials—particularly copper and tin for bronze production—across vast distances. These networks, which depended on political stability and the protection of coastal shipping routes, appear to have fractured rapidly once environmental pressures began to undermine the authority of the palace-based administrations that managed them. The disruption of trade would have had cascading consequences, as communities that had specialized in particular economic activities found themselves unable to obtain the resources on which their specialized production depended, setting off a chain reaction of economic contraction.\n\nThird, the very complexity that had enabled Bronze Age civilizations to flourish may have rendered them especially vulnerable to systemic collapse. Palace economies that concentrated resources, population, and administrative power in urban centers proved brittle when those centers could no longer maintain the redistributive systems—particularly grain storage and distribution—on which their legitimacy partly rested. As central authority weakened, the social contract that had sustained these hierarchical societies unraveled, and populations dispersed into smaller, more resilient settlement patterns that characterize the subsequent Iron Age. The Bronze Age collapse thus offers a sobering historical example of how environmental stress can trigger cascading failure in complex societies when multiple pressure points are activated simultaneously."
    },
    {
      topic: "Economics / Policy",
      thesis: "Universal Basic Income, while costly, may prove more efficient than the current patchwork of conditional welfare programs by eliminating administrative overhead and reducing poverty traps.",
      text: "Universal Basic Income—the policy proposal to provide all citizens with a regular, unconditional cash payment sufficient to cover basic living expenses—has attracted growing attention from policymakers, economists, and technology leaders concerned about the disruptive potential of automation on labor markets. While critics often raise concerns about the fiscal feasibility and potential disincentive effects of such a program, a careful examination of the evidence from pilot studies and economic modeling suggests that UBI may address structural weaknesses in existing welfare systems that conditional assistance programs have been unable to resolve. Specifically, three lines of argument support the case for UBI over the current patchwork approach: the elimination of administrative complexity, the removal of poverty traps created by means testing, and the recognition of unpaid but socially valuable contributions.\n\nFirst, the administrative costs associated with means-tested welfare programs are substantial. Governments must maintain extensive bureaucracies to determine eligibility, process applications, monitor compliance, and adjudicate disputes. By providing payments universally and recovering them from higher earners through the tax system, UBI dramatically simplifies administration. A universal program eliminates the need for intrusive eligibility assessments that many potential beneficiaries find stigmatizing, and it removes the compliance monitoring that can create adversarial relationships between recipients and the state.\n\nSecond, means-tested programs create perverse incentives that trap recipients in poverty. When benefits are reduced or eliminated as earned income rises, recipients can face effective marginal tax rates that exceed one hundred percent in some circumstances, meaning that accepting employment or working additional hours leaves them financially worse off. UBI, by providing payments unconditionally, ensures that every additional dollar earned through work translates into a net increase in household income, thereby maintaining incentives for labor force participation.\n\nThird, a UBI would provide economic recognition for forms of socially valuable work that markets do not compensate. Caregiving for children, elderly relatives, and individuals with disabilities contributes enormously to social welfare but is largely invisible in economic accounting. Similarly, volunteer work, community organizing, and creative pursuits that enrich cultural life often go uncompensated. By providing a baseline income floor, UBI would enable individuals to make choices about how to allocate their time and energy based on a broader conception of contribution than market wages alone can capture."
    },
    {
      topic: "Psychology / Cognitive Science",
      thesis: "Multitasking impairs cognitive performance not merely by dividing attention but by increasing cognitive load through task-switching costs that the brain cannot avoid.",
      text: "The belief that individuals can effectively perform multiple cognitively demanding tasks simultaneously is widespread in contemporary work culture, where the ability to multitask is often celebrated as a valuable professional skill. However, a substantial body of research in cognitive psychology and neuroscience challenges this assumption, demonstrating that what is commonly described as multitasking is more accurately characterized as rapid task-switching, and that this switching imposes measurable costs on performance, accuracy, and long-term cognitive health. The evidence converges on three central findings: the inherent limitations of attentional resources, the metabolic costs of task switching in prefrontal brain regions, and the negative effects of chronic divided attention on the capacity for sustained focus.\n\nFirst, attentional resources are fundamentally limited. The human brain's capacity to process information consciously at any given moment is constrained by the architecture of working memory and the sequential nature of conscious processing. When individuals attempt to monitor multiple streams of information simultaneously—reading an email while participating in a conference call, for example—they do not process both streams in parallel but rather alternate their attention between them, creating gaps in comprehension and retention that are often not consciously perceived by the multitasker. Experimental studies using eye-tracking and comprehension tests demonstrate that subjects consistently overestimate their ability to divide attention effectively.\n\nSecond, neuroimaging research using functional magnetic resonance imaging has revealed that task switching imposes measurable metabolic costs in the prefrontal cortex, the brain region responsible for executive functions including planning, decision-making, and impulse control. Each switch between tasks requires the brain to deactivate the neural circuits associated with the previous task and activate those appropriate to the new one, a process that consumes both time and glucose. The cumulative effect of frequent switching over the course of a workday may contribute to the subjective experience of mental fatigue that many knowledge workers report.\n\nThird, longitudinal evidence suggests that chronic media multitasking—the habitual consumption of multiple streams of digital content simultaneously—may reshape attentional capacities over time. Heavy media multitaskers perform worse than light multitaskers on tasks requiring sustained attention and the filtering of irrelevant distractors, even when they are not actively multitasking during the assessment. This finding raises the possibility that the cognitive habits cultivated in digitally saturated environments may have lasting effects on the fundamental architecture of attention."
    },
    {
      topic: "Environmental Science",
      thesis: "Reforestation, while beneficial, cannot substitute for reducing fossil fuel emissions in addressing climate change because of limitations in scale, permanence, and the timescale of carbon sequestration.",
      text: "Reforestation and afforestation have been widely promoted as natural climate solutions capable of removing significant quantities of carbon dioxide from the atmosphere while providing co-benefits for biodiversity, water quality, and rural livelihoods. Ambitious international initiatives have set targets for restoring hundreds of millions of hectares of forest cover globally. While the potential contributions of forest restoration to climate mitigation are genuine and should be pursued vigorously, relying on reforestation as a primary strategy for addressing climate change is problematic for three interconnected reasons: the physical limits on the scale of carbon sequestration that terrestrial ecosystems can provide, the vulnerability of forest carbon stocks to reversal through fire, disease, and land-use change, and the temporal mismatch between the urgent need for emissions reductions and the decades required for newly planted forests to reach their maximum carbon storage potential.\n\nFirst, the total amount of carbon that can realistically be sequestered through global reforestation is bounded by the finite area of land that is both ecologically suitable for forest cover and not required for food production, urban development, or other essential land uses. While estimates of the global reforestation potential vary, even the most optimistic assessments conclude that forest restoration can offset only a fraction of cumulative historical emissions—and far less than what would be required to compensate for continued fossil fuel combustion at current rates. Treating reforestation as an alternative to emissions reductions rather than a complement to them is therefore physically incoherent.\n\nSecond, carbon stored in forest ecosystems is inherently vulnerable to reversal. Wildfires, which are increasing in frequency and intensity in many regions due to climate change itself, can release decades of accumulated carbon sequestration back into the atmosphere in a matter of weeks. Insect outbreaks, droughts, and diseases—all of which are exacerbated by warming temperatures—further threaten the permanence of forest carbon stocks. Additionally, economic pressures to convert forested land to other uses may intensify as populations grow and demand for agricultural commodities increases, making the long-term protection of reforested areas an ongoing governance challenge.\n\nThird, newly planted forests require decades to reach ecological maturity and achieve their maximum rate of carbon uptake. In the critical near-term window during which emissions must be reduced dramatically to avoid triggering irreversible climate tipping points, reforestation cannot provide carbon removal at the necessary scale or speed. This temporal mismatch means that reforestation should be understood as a long-term carbon removal strategy that complements, but can never replace, the immediate and aggressive reduction of fossil fuel emissions."
    },
    {
      topic: "Education / Technology",
      thesis: "The replacement of traditional textbooks with digital learning materials in K-12 education offers advantages in cost, adaptability, and engagement but introduces challenges related to screen time, equitable access, and retention that must be carefully managed.",
      text: "The transition from traditional printed textbooks to digital learning materials in primary and secondary education represents one of the most significant shifts in classroom practice since the widespread adoption of compulsory schooling. School districts across numerous countries have invested substantial resources in providing students with tablets, laptops, and access to digital curriculum platforms, motivated by the promise of reduced material costs, continuously updated content, and more engaging, interactive learning experiences. While the potential benefits of this transition are real, a careful examination of the evidence reveals that the shift to digital learning materials also introduces significant challenges that must be addressed through deliberate policy design: concerns about the effects of increased screen time on student health and attention, the persistence of digital access inequities that risk widening achievement gaps, and evidence suggesting that reading comprehension may be reduced when material is presented on screens rather than on paper.\n\nFirst, the health implications of increasing the already substantial amount of time that children and adolescents spend in front of screens warrant serious consideration. Optometrists have documented rising rates of digital eye strain among young people, including symptoms such as dry eyes, headaches, and blurred vision. More concerning, a growing body of epidemiological research has identified associations between excessive screen time and adverse outcomes including sleep disruption, reduced physical activity, and increased rates of anxiety and depression among adolescents. Introducing digital textbooks into classrooms, where students already spend many hours, necessarily adds to their cumulative screen exposure, raising questions about whether the educational benefits justify the potential health costs.\n\nSecond, the promise of digital learning materials to democratize access to high-quality educational content depends on the availability of reliable internet connectivity and appropriate devices in students' homes as well as in their schools. Students from lower-income households are significantly more likely to lack broadband internet access and to share devices with multiple family members, constraining their ability to complete homework assignments and engage with digital materials outside of school hours. Without deliberate policies to close these infrastructure gaps, the shift to digital learning environments risks compounding the very inequities it was hoped to address.\n\nThird, a meta-analysis of studies comparing reading comprehension across print and digital formats has found a small but consistent advantage for print, particularly when readers are under time pressure, when texts are longer and more complex, and when readers are asked to reconstruct the sequence of information rather than simply recall isolated facts. The mechanisms underlying this difference are not fully understood, but researchers hypothesize that the tactile and spatial cues provided by physical pages—the sense of how far one has progressed through a book, the ability to physically annotate and flip between sections—support the construction of coherent mental models in ways that scrolling interfaces do not replicate."
    },
    {
      topic: "Sociology / Technology",
      thesis: "Remote work, accelerated by the pandemic, has fundamentally restructured the relationship between labor, place, and organizational culture, producing both liberation from geographic constraints and new forms of precarity.",
      text: "The rapid, large-scale transition to remote work precipitated by the COVID-19 pandemic has evolved from an emergency measure into a durable restructuring of professional employment across numerous sectors of the economy. What began as a temporary public health accommodation has, for millions of knowledge workers, become a permanent or hybrid arrangement, fundamentally altering the relationship between employment, geography, and daily life. The normalization of remote work brings genuine benefits: the decoupling of career opportunities from expensive metropolitan housing markets, the reduction of commuting-related carbon emissions and time burdens, and increased flexibility for workers with caregiving responsibilities. However, a more critical examination reveals that this transformation also introduces new challenges that existing labor laws and social policies are poorly equipped to address.\n\nFirst, the spatial decoupling of work from the office enables employers to access labor markets in regions with lower costs of living, which may lead to downward pressure on wages as workers in high-cost areas find themselves competing with a geographically expanded labor pool. Simultaneously, the erosion of the physical workplace weakens the social networks and informal mentorship relationships that have historically been crucial for career advancement, potentially exacerbating existing inequalities in professional trajectories along lines of gender, race, and class. Early evidence suggests that junior employees and those from underrepresented backgrounds may be disproportionately disadvantaged by reduced access to the informal professional development that occurs in physical workplaces.\n\nSecond, the boundary between work and personal life, which the physical commute and the separation of office from home formerly enforced, has become increasingly permeable. Remote workers report longer working hours on average than their office-based counterparts, as the absence of clear spatial and temporal boundaries makes it more difficult to disengage from work. The always-available expectation, enabled by mobile devices and collaboration platforms, can lead to a state of continuous partial attention to work responsibilities that erodes the restorative leisure time essential for long-term well-being and creativity.\n\nThird, the regulatory framework governing employment—including occupational health and safety standards, workers' compensation, and protections against discrimination and harassment—was designed for centralized workplaces where employers have visibility into working conditions and interpersonal dynamics. Extending these protections to distributed, home-based work environments presents unresolved legal and practical challenges. As the proportion of work performed outside traditional workplaces continues to grow, updating the social contract between employers and employees to account for these new realities represents an urgent policy priority that extends far beyond the technical question of which video conferencing platform to adopt."

      text: "Antimicrobial resistance, the process by which bacteria, viruses, fungi, and parasites evolve to withstand the drugs designed to eliminate them, has been recognized by the World Health Organization as one of the top ten global public health threats facing humanity. Unlike acute health crises that dominate headlines and provoke immediate political responses, antimicrobial resistance advances incrementally, accumulating genetic mutations across microbial populations over years and decades until once-treatable infections become life-threatening. The scope of the problem is staggering: a landmark study published in The Lancet estimated that bacterial antimicrobial resistance directly caused over one million deaths globally in a single recent year and was associated with nearly five million additional deaths. Addressing this crisis effectively requires coordinated action across three domains that are typically governed by separate policy regimes: the stewardship of existing antibiotics in human medicine, the regulation of antibiotic use in livestock agriculture, and the development of economic incentives to revitalize the stagnant antibiotic research pipeline.\n\nFirst, the overuse and misuse of antibiotics in human healthcare remains a primary driver of resistance. In many countries, antibiotics are available without prescriptions, leading to their widespread use for viral infections against which they are entirely ineffective. Even in settings with stronger regulatory frameworks, clinical uncertainty, patient demand, and defensive medical practices contribute to prescribing rates that exceed clinical necessity. Antimicrobial stewardship programs that provide clinicians with rapid diagnostic tools, evidence-based prescribing guidelines, and feedback on their prescribing patterns have demonstrated significant reductions in inappropriate antibiotic use without compromising patient outcomes, yet implementation remains inconsistent across healthcare systems.\n\ ring scores in the broader context of each applicant\'s opportunities and challenges.'

curity, leading people to trust unlabeled content more than they should. A determined bad actor seeking to spread misinformation would simply ignore the labeling requirements, while legitimate users would bear the compliance burden. Resources might be better directed toward media literacy education that helps people evaluate content critically regardless of its source.'

sent a more robust investment than fixed rail systems that lock cities into specific technologies and routes for decades. Additionally, the operational cost savings from autonomous technology—driverless buses, for example—could make public transit more financially sustainable and enable higher-frequency service on routes that cannot currently justify frequent human-operated service.'

n individual students\' beliefs about their abilities may distract from addressing structural factors—such as unequal school funding, large class sizes, and curriculum quality—that have far stronger evidentiary support as determinants of educational outcomes. I am not suggesting that encouraging students to persevere is harmful; I am suggesting that we should not expect mindset interventions to compensate for systemic inequities in educational opportunity.'

n reach audiences that were entirely inaccessible to them previously. The challenge is not that algorithmic curation is inherently destructive of public discourse but that we have not yet developed the regulatory frameworks and digital literacy education needed to harness its benefits while mitigating its harms.'

d have unintended consequences that actually harm our understanding of human history. Many artifacts have complex histories that do not fit neatly into narratives of colonial theft—they may have been legitimate purchases by the standards of their time, created through cultural exchange and hybrid traditions, or claimed by multiple communities with competing assertions of cultural ownership. Additionally, some objects that are claimed by modern nation-states were produced by cultures and civilizations that predate those states by centuries or millennia, raising questions about the continuity of cultural ownership. Each case deserves careful, evidence-based evaluation rather than the application of a one-size-fits-all principle that may serve political interests more than historical justice.'

      text: "Dear Dr. Anderson,\n\nI am a doctoral candidate in the Department of Sociology at the University of Michigan, currently conducting dissertation research on urban migration patterns and their relationship to labor market outcomes. I recently read your 2024 article in the American Sociological Review with great interest, and I believe the dataset you developed for that study could provide a valuable comparative dimension for my analysis. I am writing to inquire whether the dataset might be available for use by other researchers and, if so, what the procedure would be to request access. I fully understand if confidentiality constraints limit data sharing, and I would be equally grateful for any summary statistics or methodological guidance you might be able to offer.\n\nRespectfully,\nDavid Okafor"
    },
    {
      topic: "Thanking a Guest Speaker",
      text: "Dear Ms. Patel,\n\nOn behalf of the Undergraduate Business Association, I want to extend our sincere gratitude for your engaging and insightful presentation on sustainable supply chain management last evening. Our members found your discussion of how companies can balance profitability with environmental responsibility both practical and inspiring. Several students have mentioned that your talk gave them a new perspective on career paths they had not previously considered. Your willingness to stay afterward and answer individual questions was especially generous, and it made a meaningful impression on everyone who attended. We hope to have the opportunity to welcome you back to campus for future events. Thank you again for sharing your time and expertise with us.\n\nWith thanks,\nJessica Wong, UBA President"
    },
    {
      topic: "Proposing a Panel Discussion",
      text: "Dear Colleagues,\n\nI am writing to propose organizing a panel discussion on the ethical implications of generative artificial intelligence in higher education for the upcoming Faculty Development Conference in March. As these technologies become increasingly integrated into both teaching and research practices, I believe a structured conversation about how our institution should approach them would be both timely and valuable. I have reached out to Dr. Chen from Computer Science and Professor Williams from the School of Education, both of whom have expressed interest in participating. If you think this topic would fit the conference program, I would be happy to develop a more detailed proposal including learning objectives, discussion questions, and a proposed format. I welcome any thoughts or suggestions you might have.\n\nBest regards,\nRobert Kim"
    },
    {
      topic: "Withdrawing an Application",
      text: "Dear Admissions Committee,\n\nI am writing to respectfully withdraw my application for admission to the Master of Public Health program for the Fall 2026 term. I remain deeply impressed by your program's commitment to community-based health interventions and its outstanding faculty, and the decision to withdraw was a difficult one. However, I have recently accepted a research fellowship that requires my full-time commitment and aligns very closely with my long-term career goals in global health policy. I am genuinely grateful for the time and consideration the committee has already devoted to reviewing my application materials. I hope to have the opportunity to engage with your program in the future, perhaps through professional collaborations or continuing education.\n\nRespectfully,\nAmara Obi"
    },
    {
      topic: "Asking for Clarification on an Assignment",
      text: "Dear Professor Garcia,\n\nI hope you are having a good week. I am writing to ask for clarification regarding the research paper due on November 20th. The assignment description mentions that we should incorporate at least five primary sources, but I want to confirm whether government reports and official policy documents count as primary sources for this purpose, or whether you are specifically expecting peer-reviewed journal articles. I want to make sure I am on the right track before I proceed further with my literature search. Thank you for your guidance, and I apologize for troubling you with this question. I will be sure to attend your office hours next week if a more detailed discussion would be helpful.\n\nBest,\nChris Tanaka"
    },
  ]
};

// ══════════════════════════════════════════════════════════════
//  Application State
// ══════════════════════════════════════════════════════════════

let targetText = "";
let startTime = null;
let finished = false;
let totalKeystrokes = 0;
let correctKeystrokes = 0;
let timerInterval = null;
let currentType = "integrated";

// DOM
const passageTextEl  = document.getElementById("passage-text");
const typingInput    = document.getElementById("typing-input");
const taskTypeTag    = document.getElementById("task-type-tag");
const fieldLabel     = document.getElementById("field-label");
const wpmEl          = document.getElementById("wpm");
const accuracyEl     = document.getElementById("accuracy");
const timerEl        = document.getElementById("timer");
const progressEl     = document.getElementById("progress");
const progressBar    = document.getElementById("progress-bar");
const overlay        = document.getElementById("overlay");

// ── Helpers ───────────────────────────────────────

function pickEntry(type) {
  const pool = PASSAGES[type];
  return pool[Math.floor(Math.random() * pool.length)];
}

function escapeHtml(str) {
  const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
  return str.replace(/[&<>"]/g, c => map[c]);
}

// ── Load ──────────────────────────────────────────

function loadPassage(type) {
  const entry = pickEntry(type);
  targetText = entry.text;
  totalKeystrokes = 0;
  correctKeystrokes = 0;
  finished = false;
  startTime = null;
  clearInterval(timerInterval);

  // Update tags & labels
  if (type === "integrated") {
    taskTypeTag.textContent = "Integrated Writing";
    taskTypeTag.className = "task-type-tag tag-integrated";
    fieldLabel.textContent = entry.topic + "  ·  " + (entry.thesis || "");
  } else if (type === "discussion") {
    taskTypeTag.textContent = "Academic Discussion";
    taskTypeTag.className = "task-type-tag tag-discussion";
    fieldLabel.textContent = entry.topic + "  ·  Prof. " + (entry.professor || "");
  } else if (type === "academic") {
    taskTypeTag.textContent = "Academic Writing";
    taskTypeTag.className = "task-type-tag tag-academic";
    fieldLabel.textContent = entry.topic;
  } else if (type === "email") {
    taskTypeTag.textContent = "Email Writing";
    taskTypeTag.className = "task-type-tag tag-email";
    fieldLabel.textContent = entry.topic;
  }

  typingInput.value = "";
  typingInput.disabled = false;
  typingInput.focus();

  renderPassage();
  updateStats(true);
  overlay.classList.remove("show");
}

// ── Render ────────────────────────────────────────

function renderPassage() {
  const input = typingInput.value;
  let html = "";

  for (let i = 0; i < targetText.length; i++) {
    const ch = targetText[i];
    if (ch === "\n") {
      let cls = "pending";
      if (i < input.length) {
        cls = input[i] === "\n" ? "correct" : "incorrect";
      } else if (i === input.length) {
        cls = "current";
      }
      html += `<span class="${cls} nl">&#8629;</span><br>`;
      continue;
    }
    let cls = "pending";
    if (i < input.length) {
      cls = input[i] === ch ? "correct" : "incorrect";
    } else if (i === input.length) {
      cls = "current";
    }
    html += `<span class="${cls}">${escapeHtml(ch)}</span>`;
  }

  passageTextEl.innerHTML = html;

  // Auto-scroll
  const cur = passageTextEl.querySelector("span.current");
  if (cur) cur.scrollIntoView({ block: "nearest", behavior: "smooth" });

  // Done?
  if (input.length >= targetText.length && !finished) finish();
}

// ── Stats ─────────────────────────────────────────

function updateStats(reset) {
  if (reset) {
    wpmEl.textContent = "0";
    accuracyEl.textContent = "100";
    timerEl.textContent = "0:00";
    progressEl.textContent = "0%";
    progressBar.style.width = "0%";
    return;
  }
  if (totalKeystrokes > 0) {
    accuracyEl.textContent = Math.round((correctKeystrokes / totalKeystrokes) * 100);
  }
  if (startTime) {
    const mins = (Date.now() - startTime) / 60000;
    if (mins > 0.005) wpmEl.textContent = Math.round((correctKeystrokes / 5) / mins);
    const s = Math.floor((Date.now() - startTime) / 1000);
    timerEl.textContent = `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, "0")}`;
  }
  if (targetText.length > 0) {
    const pct = Math.round((typingInput.value.length / targetText.length) * 100);
    progressEl.textContent = pct + "%";
    progressBar.style.width = pct + "%";
  }
}

// ── Timer ─────────────────────────────────────────

function startTimer() {
  if (!startTime) {
    startTime = Date.now();
    timerInterval = setInterval(() => updateStats(), 200);
  }
}

// ── Finish ────────────────────────────────────────

function finish() {
  finished = true;
  typingInput.disabled = true;
  clearInterval(timerInterval);
  updateStats();

  const mins = (Date.now() - startTime) / 60000;
  const wpm = mins > 0 ? Math.round((correctKeystrokes / 5) / mins) : 0;
  const acc = totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100;
  const s = Math.floor((Date.now() - startTime) / 1000);

  document.getElementById("r-wpm").textContent   = wpm;
  document.getElementById("r-acc").textContent   = acc;
  document.getElementById("r-chars").textContent = targetText.length;
  document.getElementById("r-time").textContent  =
    `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, "0")}`;

  setTimeout(() => overlay.classList.add("show"), 350);
}

function closeResults() { loadPassage(currentType); }

// ── Input ─────────────────────────────────────────

typingInput.addEventListener("input", () => {
  if (finished) return;
  const val = typingInput.value;
  const prev = totalKeystrokes;

  if (val.length > prev) {
    const added = val.length - prev;
    totalKeystrokes += added;
    for (let i = prev; i < val.length; i++) {
      if (i < targetText.length && val[i] === targetText[i]) correctKeystrokes++;
    }
  } else if (val.length < prev) {
    totalKeystrokes += (prev - val.length);
  }

  startTimer();
  renderPassage();
  updateStats();
});

typingInput.addEventListener("paste", e => e.preventDefault());

// ── Buttons ───────────────────────────────────────

document.getElementById("btn-restart").addEventListener("click", () => loadPassage(currentType));
document.getElementById("btn-shuffle").addEventListener("click", () => loadPassage(currentType));
document.getElementById("btn-reset").addEventListener("click", () => {
  typingInput.value = "";
  totalKeystrokes = 0;
  correctKeystrokes = 0;
  startTime = null;
  clearInterval(timerInterval);
  renderPassage();
  updateStats(true);
});

// Task-type toggle
document.querySelectorAll(".type-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentType = btn.dataset.type;
    loadPassage(currentType);
  });
});

// ── Keyboard shortcuts ────────────────────────────

document.addEventListener("keydown", e => {
  if (e.key === "Tab") { e.preventDefault(); loadPassage(currentType); }
  if (e.key === "Escape" && document.activeElement === typingInput && !finished) {
    typingInput.value = "";
    totalKeystrokes = 0;
    correctKeystrokes = 0;
    startTime = null;
    clearInterval(timerInterval);
    renderPassage();
    updateStats(true);
  }
  if (e.key === "Enter" && overlay.classList.contains("show")) closeResults();
});

// ── Start ─────────────────────────────────────────

loadPassage(currentType);
</script>
</body>
</html>
